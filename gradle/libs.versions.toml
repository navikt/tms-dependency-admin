[metadata]
format.version = "1.1"

[versions]
flyway = "13.8.0"
jacksonDatatype = "2.22.2"
jjwt = "0.13.0"
junitJupiter = "6.1.3"
kotest = "6.2.5"
kotlin = "2.4.20"
ktor = "3.6.0"
prometheus = "1.9.0"
testContainer = "2.0.5"
tmsCommonLib = "5.3.5"
tmsKafkaTools = "2.5.1"
tmsKtorSupport = "6.0.3"

[libraries]

flyway-core = { group = "org.flywaydb", name = "flyway-core", version.ref = "flyway" }
flyway-postgres = { group = "org.flywaydb", name = "flyway-database-postgresql", version.ref = "flyway"}

hikari-cp = { group = "com.zaxxer", name = "HikariCP", version = "7.1.0" }

jackson-datatypeJsr310 = { group = "com.fasterxml.jackson.datatype", name = "jackson-datatype-jsr310", version.ref = "jacksonDatatype" }
jackson-moduleKotlin = { group = "com.fasterxml.jackson.module", name = "jackson-module-kotlin", version.ref = "jacksonDatatype" }

jjwt-api = { group = "io.jsonwebtoken", name = "jjwt-api", version.ref = "jjwt" }
jjwt-impl = { group = "io.jsonwebtoken", name = "jjwt-impl", version.ref = "jjwt" }
jjwt-jackson = { group = "io.jsonwebtoken", name = "jjwt-jackson", version.ref = "jjwt" }
jjwt-orgjson = { group = "io.jsonwebtoken", name = "jjwt-orgjson", version.ref = "jjwt" }

junit-api = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junitJupiter" }
junit-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "junitJupiter" }
junit-params = { group = "org.junit.jupiter", name = "junit-jupiter-params", version.ref = "junitJupiter" }

junit-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version = "6.1.3" }

kafka-clients = { group = "org.apache.kafka", name = "kafka-clients", version = "4.3.1" }

kluent = { group = "org.amshove.kluent", name = "kluent", version = "1.73" }

kotest-runner = { group = "io.kotest", name = "kotest-runner-junit5", version.ref = "kotest" }
kotest-assertion = { group = "io.kotest", name = "kotest-assertions-core", version.ref = "kotest" }
kotest-extensions = { group = "io.kotest", name = "kotest-extensions", version.ref = "kotest" }

kotlin = { group = "org.jetbrains.kotlin", name = "kotlin-reflect", version.ref = "kotlin" }
kotlin-logging = { group = "io.github.oshai", name = "kotlin-logging", version = "8.0.4" }
kotlinx = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version = "1.11.0" }

kotli-query = { group = "com.github.seratch", name = "kotliquery", version = "1.9.1" }

ktor-server-core = { group = "io.ktor", name = "ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { group = "io.ktor", name = "ktor-server-netty", version.ref = "ktor" }
ktor-server-defaultheader = { group = "io.ktor", name = "ktor-server-default-headers", version.ref = "ktor" }
ktor-server-metrics = { group = "io.ktor", name = "ktor-server-metrics-micrometer", version.ref = "ktor" }
ktor-server-auth = { group = "io.ktor", name = "ktor-server-auth", version.ref = "ktor" }
ktor-server-authJwt = { group = "io.ktor", name = "ktor-server-auth-jwt", version.ref = "ktor" }
ktor-server-contentNegotiation = { group = "io.ktor", name = "ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-statusPages = { group = "io.ktor", name = "ktor-server-status-pages", version.ref = "ktor" }
ktor-server-html = { group = "io.ktor", name = "ktor-server-html-builder", version.ref = "ktor" }
ktor-server-cors = { group = "io.ktor", name = "ktor-server-cors", version.ref = "ktor" }

ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-apache5 = { group = "io.ktor", name = "ktor-client-apache5", version.ref = "ktor" }
ktor-client-contentNegotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }

ktor-serialization-kotlinx = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-serialization-jackson = { group = "io.ktor", name = "ktor-serialization-jackson", version.ref = "ktor" }

ktor-test-mock-client = { group = "io.ktor", name = "ktor-client-mock", version.ref = "ktor" }
ktor-test-server = { group = "io.ktor", name = "ktor-server-test-host", version.ref = "ktor" }

logback-classic = { group = "ch.qos.logback", name = "logback-classic", version = "1.6.5" }
logback-encoder = { group = "net.logstash.logback", name = "logstash-logback-encoder", version = "9.0" }

registry-prometheus = { group = "io.micrometer", name = "micrometer-registry-prometheus", version = "1.17.1" }

mockk = { group = "io.mockk", name = "mockk", version = "1.14.11" }

postgresql = { group = "org.postgresql", name = "postgresql", version = "42.7.13" }

prometheus-metric-core = { group = "io.prometheus", name = "prometheus-metrics-core", version.ref = "prometheus" }
prometheus-exporter = { group = "io.prometheus", name = "prometheus-metrics-exporter-common", version.ref = "prometheus" }

testContainer-junit = { group = "org.testcontainers", name = "testcontainers-junit-jupiter", version.ref = "testContainer" }
testContainer-core = { group = "org.testcontainers", name = "testcontainers", version.ref = "testContainer" }
testContainer-postgresql = { group = "org.testcontainers", name = "testcontainers-postgresql", version.ref = "testContainer" }

tms-commonLib-kubernetes = { group = "no.nav.tms.common", name = "kubernetes", version.ref = "tmsCommonLib" }
tms-commonLib-metrics = { group = "no.nav.tms.common", name = "metrics", version.ref = "tmsCommonLib" }
tms-commonLib-observability = { group = "no.nav.tms.common", name = "observability", version.ref = "tmsCommonLib" }
tms-commonLib-postgres = { group = "no.nav.tms.common", name = "postgres", version.ref = "tmsCommonLib" }
tms-commonLib-teamLogger = { group = "no.nav.tms.common", name = "team-logger", version.ref = "tmsCommonLib" }
tms-commonLib-utils = { group = "no.nav.tms.common", name = "utils", version.ref = "tmsCommonLib" }

tms-kafkaTools-application = { group = "no.nav.tms.kafka", name = "kafka-application", version.ref = "tmsKafkaTools" }
tms-kafkaTools-producer = { group = "no.nav.tms.kafka", name = "kafka-producer-utils", version.ref = "tmsKafkaTools" }

tms-ktor-tokenSupport-entraId = { group = "no.nav.tms.token.support", name = "entra-id-token-verification", version.ref = "tmsKtorSupport" }
tms-ktor-tokenSupport-mock-entraId = { group = "no.nav.tms.token.support", name = "entra-id-token-verification-mock", version.ref = "tmsKtorSupport" }
tms-ktor-tokenSupport-entraId-fetcher = { group = "no.nav.tms.token.support", name = "entra-id-token-fetcher", version.ref = "tmsKtorSupport" }
tms-ktor-tokenSupport-userLoginRoutes = { group = "no.nav.tms.token.support", name = "user-login-routes", version.ref = "tmsKtorSupport" }
tms-ktor-tokenSupport-userTokenVerification = { group = "no.nav.tms.token.support", name = "user-token-verification", version.ref = "tmsKtorSupport" }
tms-ktor-tokenSupport-mock-userTokenVerification = { group = "no.nav.tms.token.support", name = "user-token-verification-mock", version.ref = "tmsKtorSupport" }
tms-ktor-tokenSupport-exchange = { group = "no.nav.tms.token.support", name = "user-token-exchange", version.ref = "tmsKtorSupport" }


[bundles]
flyway = ["flyway-core", "flyway-postgres"]
jackson = [ "jackson-datatypeJsr310", "jackson-moduleKotlin" ]
jjwt = [ "jjwt-api", "jjwt-jackson", "jjwt-impl", "jjwt-orgjson" ]
junit = [ "junit-api", "junit-engine", "junit-launcher"]
kotest = [ "kotest-assertion", "kotest-extensions", "kotest-runner" ]
kotlin = [ "kotli-query", "kotlin", "kotlin-logging", "kotlinx" ]
ktor-server = [ "ktor-server-auth", "ktor-server-authJwt", "ktor-server-contentNegotiation", "ktor-server-core", "ktor-server-cors", "ktor-server-netty", "ktor-server-statusPages" ]
ktor-client = [ "ktor-client-core", "ktor-client-contentNegotiation", "ktor-client-apache5" ]
logback = [ "logback-classic", "logback-encoder" ]
prometheus = [ "prometheus-exporter", "prometheus-metric-core", "registry-prometheus" ]
test-container = [ "testContainer-core", "testContainer-junit", "testContainer-postgresql" ]
tms-common = [ "tms-commonLib-kubernetes", "tms-commonLib-metrics", "tms-commonLib-observability", "tms-commonLib-postgres",
"tms-commonLib-teamLogger", "tms-commonLib-utils" ]
tms-kafka = [ "tms-kafkaTools-application", "tms-kafkaTools-producer" ]

[plugins]
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
