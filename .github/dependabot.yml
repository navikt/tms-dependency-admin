version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    groups:
      building-tools:
        patterns:
          - "com.diffplug.spotless*"
          - "com.gradleup.shadow*"
          - "gradle-wrapper"
          - "io.ktor"
      database:
        patterns:
          - "com.zaxxer:*"
          - "org.postgresql:*"
          - "org.testcontainers:*"
          - "org.flywaydb:*"
          - "io.prometheus:*"
          - "io.micrometer:*"
          - "ch.qos.logback:*"
          - "net.logstash.logback:*"
      test:
        patterns:
          - "io.kotest:*"
          - "io.mockk:*"
          - "io.cucumber:*"
          - "org.junit.platform:*"
          - "otg.testcontainers:*"
          - "io.mockk"
      tms:
        patterns:
          - "no.nav.tms:*"
    cooldown:
      default-days: 7