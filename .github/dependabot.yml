version: 2

registries:
  nav-maven:
    type: maven-repository
    url: https://github-package-registry-mirror.gc.nav.no/cached/maven-release

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    registries:
      - nav-maven
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 3
    labels:
      - github-actions

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    groups:
      building-tools:
        patterns:
          - "com.diffplug.spotless*"
          - "com.gradleup.shadow*"
          - "gradle-wrapper"
          - "io.ktor"
        update-types:
          - "minor"
          - "patch"
      database:
        patterns:
          - "com.zaxxer:*"
          - "org.postgresql:*"
          - "org.testcontainers:*"
          - "org.flywaydb:*"
          - "io.prometheus:*"
          - "io.micrometer:*"
          - "ch.qos.logback:*"
          - "net.logstash.logback:*"
        update-types:
          - "minor"
          - "patch"
      test:
        patterns:
          - "io.kotest:*"
          - "io.mockk:*"
          - "io.cucumber:*"
          - "org.junit.platform:*"
          - "org.testcontainers:*"
          - "io.mockk"
        update-types:
          - "minor"
          - "patch"
      gradle-major:
        patterns:
          - "*"
        update-types:
          - "major"
      tms:
        patterns:
          - "no.nav.tms:*"
    labels:
      - gradle
      - dependencies
    cooldown:
      default-days: 7