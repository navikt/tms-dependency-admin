version: 2

registries:
  nav-maven:
    type: maven-repository
    url: https://github-package-registry-mirror.gc.nav.no/cached/maven-release

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 3
    labels:
      - github-actions

  - package-ecosystem: "gradle"
    directory: "/"
    registries:
      - nav-maven
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    groups:
      runtime-libs:
        patterns:
          - "gradle-wrapper"
          - "io.ktor:*"
          - "com.github.seratch:*"
          - "org.jetbrains.kotlin:*"
          - "io.github.oshai:*"
          - "org.jetbrains.kotlinx*"
          - "com.zaxxer:*"
          - "org.postgresql:*"
          - "org.flywaydb:*"
          - "io.prometheus:*"
          - "io.micrometer:*"
          - "ch.qos.logback:*"
          - "net.logstash.logback:*"
          - "org.apache.*"
          - "org.slf4j:*"
          - "org.junit.jupiter:*"
          - "com.fasterxml.jackson*"
        update-types:
          - "minor"
          - "patch"

      test-libs:
        patterns:
          - "io.kotest:*"
          - "io.mockk:*"
          - "org.junit.platform:*"
          - "org.testcontainers:*"
          - "io.mockk"
        update-types:
          - "minor"
          - "patch"

      plugins-libs:
        patterns:
          - "org.jetbrains.kotlin.jvm*"
          - "org.jetbrains.kotlin.plugin*"
          - "no.nav.tms.jarBundling*"
        update-types:
          - "minor"
          - "patch"
      tms-libs:
        patterns:
          - "no.nav.tms*:*"
        update-types:
          - "minor"
          - "patch"

      gradle-major:
        patterns:
          - "*"
        update-types:
          - "major"

    labels:
      - gradle
      - dependencies
    cooldown:
      default-days: 7
